name: Bot Cron Jobs

on:
  schedule:
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 20 * * *"
    - cron: "0 * * * *"
    - cron: "0 20 * * 0"
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: false
        type: choice
        options:
          - daily
          - midday
          - evening
          - review
          - weekly

jobs:
  daily:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'daily')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Daily Words
        if: github.event_name == 'schedule' && startsWith(toJson(github.event), '{"schedule":["0 8 * * *"]}')
        run: curl -X POST "${{ secrets.VERCEL_URL }}/api/cron/daily"

  midday:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'midday')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Midday Recall
        if: github.event_name == 'schedule' && startsWith(toJson(github.event), '{"schedule":["0 12 * * *"]}')
        run: curl -X POST "${{ secrets.VERCEL_URL }}/api/cron/midday"

  evening:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'evening')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Evening Challenge
        if: github.event_name == 'schedule' && startsWith(toJson(github.event), '{"schedule":["0 20 * * *"]}')
        run: curl -X POST "${{ secrets.VERCEL_URL }}/api/cron/evening"

  review:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'review')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Review Job
        if: github.event_name == 'schedule' && startsWith(toJson(github.event), '{"schedule":["0 * * * *"]}')
        run: curl -X POST "${{ secrets.VERCEL_URL }}/api/cron/review"

  weekly:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.job == 'weekly')
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Weekly Summary
        if: github.event_name == 'schedule' && startsWith(toJson(github.event), '{"schedule":["0 20 * * 0"]}')
        run: curl -X POST "${{ secrets.VERCEL_URL }}/api/cron/weekly"
